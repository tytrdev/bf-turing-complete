name: Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache the book's Lake packages (Verso)
        uses: actions/cache@v4
        with:
          path: book/.lake
          key: book-lake-${{ hashFiles('book/lake-manifest.json', 'book/lean-toolchain') }}
      - name: Build the proof (the book extracts its code from here)
        run: |
          lake exe cache get
          lake build BfTuringComplete.Exposition.Example
      - name: Build the book
        working-directory: book
        run: lake exe book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_out/html-multi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
