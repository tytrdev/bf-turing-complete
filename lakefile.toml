name = "bf-turing-complete"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BfTuringComplete"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "BfTuringComplete"

# Lets the Verso book in `book/` extract highlighted code from these modules.
[[require]]
name = "subverso"
git = "https://github.com/leanprover/subverso"
rev = "no-modules/f9c40d40521bc71f0c33bff422d085dd86d359bd"
